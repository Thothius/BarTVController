<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar TV</title>
<style>
  :root { color-scheme: dark; --bg:#0b0b0d; --card:#1a1a1e; --accent:#ffb340; --ok:#30d158; --err:#ff453a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:#eee; }
  main { max-width: 520px; margin: 0 auto; padding: 14px; display: grid; gap: 12px; }
  h1 { font-size: 1.1rem; margin: 6px 0 0; font-weight: 600; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
  .card h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color:#8e8e93; margin:0; }
  .row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .row.two { grid-template-columns: 1fr 1fr; }
  button { font: inherit; font-size: 1rem; font-weight: 600; padding: 18px 8px; border: 0; border-radius: 12px; background:#2c2c31; color:#fff; cursor:pointer; }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); color:#000; padding: 22px; font-size: 1.15rem; }
  button.ghost { background: transparent; border:1px solid #3a3a3f; color:#bbb; font-weight:400; padding: 10px; font-size:.9rem; }
  button:disabled { opacity: .45; }
  input[type=range] { width: 100%; height: 34px; accent-color: var(--accent); }
  select, input[type=text], input[type=url] { width: 100%; font: inherit; padding: 12px; border-radius: 10px; border:1px solid #3a3a3f; background:#141417; color:#eee; }
  .status { font-size: .85rem; color:#999; display:grid; gap:4px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:var(--err); vertical-align:middle; }
  .dot.on { background: var(--ok); }
  #toast { position: fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#2c2c31; padding:10px 16px; border-radius:10px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; text-align:center; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--err); color:#fff; }
  #pinModal { position:fixed; inset:0; background:#000d; display:none; align-items:center; justify-content:center; }
  #pinModal.show { display:flex; }
  #pinModal .card { width: 280px; }
</style>
</head>
<body>
<main>
  <h1>Bar TV</h1>

  <section class="card">
    <button class="primary" id="adBtn" onclick="ad()">Ad Break</button>
    <div class="status" id="status">…</div>
  </section>

  <section class="card">
    <h2>TV</h2>
    <div class="row two">
      <button id="inNormal">Live</button>
      <button id="inSignage">Signage</button>
    </div>
    <h2 style="margin-top:6px">Volume <span id="volVal"></span></h2>
    <input type="range" id="vol" min="0" max="100" value="20">
    <div class="row two">
      <button id="muteBtn">Mute</button>
      <button class="ghost" onclick="post('/api/stop',{},'Stopped')">Stop media</button>
    </div>
  </section>

  <section class="card">
    <h2>Play on TV</h2>
    <select id="fileSel"><option value="">— saved files —</option></select>
    <div class="status" id="fileHint"></div>
    <input type="url" id="urlIn" placeholder="https://…/video.mp4 (or /media/file)">
    <select id="kindSel">
      <option value="video">Video</option>
      <option value="audio">Audio</option>
      <option value="image">Image</option>
    </select>
    <button onclick="stream()">Play</button>
  </section>

  <section class="card">
    <h2>Pairing</h2>
    <button class="ghost" id="pairBtn" onclick="pair()">Pair TV (accept prompt on remote)</button>
    <button class="ghost" onclick="resetPin()">Reset saved PIN</button>
    <div class="status" id="pairHint"></div>
    <div class="status" id="inputs"></div>
  </section>

  <section class="card">
    <h2>Auto ads</h2>
    <button class="ghost" id="schedBtn">…</button>
  </section>
</main>

<div id="pinModal">
  <div class="card">
    <h2>Enter PIN</h2>
    <input type="text" id="pinIn" inputmode="numeric" maxlength="6" placeholder="6-digit PIN">
    <div class="row two">
      <button class="ghost" onclick="closePin()">Cancel</button>
      <button class="primary" onclick="submitPin()">OK</button>
    </div>
    <div class="status" id="pinErr" style="color:var(--err)"></div>
  </div>
</div>

<div id="toast"></div>

<script>
let pin = localStorage.getItem('bartv_pin') || '';
let state = {};
const $ = id => document.getElementById(id);

function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 2500);
}

function headers() { return {'Content-Type': 'application/json', 'X-Pin': pin}; }

async function api(url, body) {
  const r = await fetch(url, body === undefined ? {} : {method: 'POST', headers: headers(), body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) {
    askPin(() => api(url, body), pin ? 'Wrong PIN - try again' : 'Enter PIN');
    throw new Error('PIN required');
  }
  if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : r.statusText);
  return data;
}
async function post(url, body, okMsg) {
  try { await api(url, body); if (okMsg) toast(okMsg); refresh(); return true; }
  catch (e) { if (e.message !== 'PIN required') toast(e.message, true); return false; }
}

let pinResolve = null;
function askPin(cb, err) { pinResolve = cb; $('pinErr').textContent = err || ''; $('pinModal').className = 'show'; $('pinIn').focus(); }
function resetPin() { localStorage.removeItem('bartv_pin'); pin = ''; toast('Saved PIN cleared'); }
function closePin() { $('pinModal').className = ''; pinResolve = null; $('pinErr').textContent = ''; }
function submitPin() {
  pin = $('pinIn').value.trim();
  const cb = pinResolve; closePin(); $('pinIn').value = '';
  if (cb && pin) { localStorage.setItem('bartv_pin', pin); cb(); }
}
$('pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') submitPin(); });

async function ad() { await post('/api/trigger-ad', {}, 'Ad break started'); }
async function pair() {
  $('pairBtn').disabled = true; $('pairHint').textContent = 'Accept the prompt on the TV within 60s…';
  const ok = await post('/api/pair', {}, 'Paired');
  $('pairBtn').disabled = false;
  $('pairHint').textContent = ok ? '' : 'Pairing failed or timed out';
}
function stream() {
  const url = $('fileSel').value || $('urlIn').value.trim();
  if (!url) { toast('Pick a file or paste a URL', true); return; }
  post('/api/stream', {url, kind: $('kindSel').value}, 'Playing on TV');
}
$('fileSel').onchange = () => { if ($('fileSel').value) $('urlIn').value = $('fileSel').value; };
$('inNormal').onclick = () => post('/api/input', {input: state.normal_input}, 'Live');
$('inSignage').onclick = () => post('/api/input', {input: state.signage_input}, 'Signage');
$('muteBtn').onclick = async () => { const m = !$('muteBtn').dataset.m; $('muteBtn').dataset.m = m; $('muteBtn').textContent = m ? 'Unmute' : 'Mute'; await post('/api/mute', {mute: m}, m ? 'Muted' : 'Unmuted'); };
$('schedBtn').onclick = async () => { await post('/api/scheduler', {enabled: !state.scheduler_enabled}, state.scheduler_enabled ? 'Auto ads paused' : 'Auto ads on'); };
const vol = $('vol');
vol.oninput = () => $('volVal').textContent = vol.value;
vol.onchange = () => post('/api/volume', {level: +vol.value});
$('volVal').textContent = vol.value;

async function loadFiles() {
  try {
    const d = await (await fetch('/api/files')).json();
    $('fileSel').innerHTML = '<option value="">— saved files —</option>' + d.files.map(f =>
      `<option value="${f.url}">${f.name}</option>`).join('');
  } catch {}
}

async function refresh() {
  try { state = await (await fetch('/api/status')).json(); } catch { $('status').innerHTML = 'Server unreachable'; return; }
  const t = s => s ? new Date(s).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '—';
  $('status').innerHTML = `
    <div><span class="dot ${state.paired ? 'on' : ''}"></span>TV ${state.paired ? 'paired' : 'not paired'} · ${state.displays_connected} screen${state.displays_connected === 1 ? '' : 's'}${state.mock_tv ? ' · mock' : ''}</div>
    <div>${state.ad_running ? '<b>Ad playing…</b>' : 'Next auto ad: ' + (state.scheduler_enabled ? t(state.next_ad) : 'paused') + ' · Last: ' + t(state.last_ad)}</div>
    ${state.promo_exists === false ? '<div style="color:var(--err)">No promo video - drop an mp4 into static/media/</div>' : ''}
    ${state.last_error ? `<div style="color:var(--err)">${state.last_error}</div>` : ''}`;
  $('inputs').textContent = state.tv_inputs && state.tv_inputs.length ? 'TV inputs: ' + state.tv_inputs.join(', ') : '';
  $('adBtn').disabled = state.ad_running;
  $('schedBtn').textContent = state.scheduler_enabled ? 'Pause auto ads' : 'Auto ads every 30m';
  $('inNormal').textContent = 'Live (' + state.normal_input + ')';
  $('inSignage').textContent = 'Signage (' + state.signage_input + ')';
}
refresh(); loadFiles();
setInterval(refresh, 5000);
</script>
</body>
</html>
