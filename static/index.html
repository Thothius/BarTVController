<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarTV Controller</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0d0e12; --panel:#15171d; --panel2:#1b1e26; --line:#262a33; --line2:#323744;
    --text:#e8eaf0; --muted:#8a90a0; --dim:#5d6372;
    --accent:#ffb340; --accent-ink:#1a1204; --ok:#34d399; --warn:#fbbf24; --err:#f87171; --blue:#60a5fa;
    --r:12px; --r-sm:8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; height: 60px; display:flex; align-items:center; gap:16px; padding: 0 28px;
            background: rgba(13,14,18,.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.01em; text-decoration:none; font-size:15px; }
  .brand .logo { width:28px; height:28px; border-radius:8px; background: linear-gradient(135deg, var(--accent), #ff7a3d);
                 display:grid; place-items:center; color: var(--accent-ink); font-size:13px; font-weight:800; }
  .crumbs { color: var(--muted); display:flex; align-items:center; gap:8px; }
  .crumbs b { color: var(--text); font-weight:600; }
  .spacer { flex: 1; }
  .chip { display:inline-flex; align-items:center; gap:8px; height:34px; padding: 0 12px; border-radius: 999px;
          background: var(--panel); border:1px solid var(--line); color: var(--muted); font-size:13px; white-space: nowrap; }
  button.chip:hover { border-color: var(--line2); color: var(--text); }
  .chip b { color: var(--text); font-weight: 600; }
  .dot { width:8px; height:8px; border-radius:50%; background: var(--dim); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(52,211,153,.15); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(251,191,36,.15); }
  .dot.err { background: var(--err); box-shadow: 0 0 0 3px rgba(248,113,113,.15); }
  .dot.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .gear { width:38px; height:38px; border-radius: 10px; display:grid; place-items:center; background: var(--panel);
          border:1px solid var(--line); color: var(--muted); }
  .gear:hover, .gear.active { color: var(--text); border-color: var(--line2); }
  .gear svg { width:19px; height:19px; }

  /* ---------- layout ---------- */
  main { max-width: 1320px; margin: 0 auto; padding: 28px; }
  .view-head { display:flex; align-items:center; gap:14px; margin-bottom: 22px; }
  .view-head h1 { font-size: 22px; margin:0; font-weight: 700; letter-spacing: -.01em; }
  .view-head .sub { color: var(--muted); }
  .back { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background: var(--panel); display:grid; place-items:center; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--text); border-color: var(--line2); }

  .panel { background: var(--panel); border:1px solid var(--line); border-radius: var(--r); }
  .panel-pad { padding: 20px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }

  /* ---------- buttons / inputs ---------- */
  .btn { height: 38px; padding: 0 16px; border-radius: 10px; border:1px solid var(--line2); background: var(--panel2);
         display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight: 600; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: #444a58; background: #222631; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { background: #ffc266; border-color: #ffc266; }
  .btn.danger { color: var(--err); }
  .btn.danger:hover:not(:disabled) { border-color: rgba(248,113,113,.5); background: rgba(248,113,113,.08); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover:not(:disabled) { color: var(--text); background: var(--panel2); border-color: var(--line); }
  .btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; border-radius: 8px; }
  .btn.lg { height: 52px; font-size: 16px; border-radius: 12px; }
  .btn svg { width: 16px; height: 16px; }
  .icon-btn { width: 30px; height: 30px; padding: 0; border-radius: 8px; border:1px solid transparent; background: transparent;
              display:grid; place-items:center; color: var(--muted); }
  .icon-btn:hover { color: var(--text); background: var(--panel2); border-color: var(--line); }
  .icon-btn.danger:hover { color: var(--err); }
  .icon-btn svg { width: 16px; height: 16px; }
  .field { height: 38px; padding: 0 12px; border-radius: 10px; border:1px solid var(--line2); background: #101217; outline: none; min-width: 0; }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,179,64,.15); }
  .seg { display:inline-flex; padding: 3px; gap: 3px; border-radius: 10px; background: #101217; border:1px solid var(--line); }
  .seg button { height: 30px; padding: 0 12px; border:0; border-radius: 7px; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; }
  .seg button.on { background: var(--panel2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
  .switch { position: relative; width: 42px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position:absolute; inset:0; border-radius: 999px; background: #2a2e38; transition: .2s; cursor: pointer; }
  .switch span::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#cfd3dc; transition:.2s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); background: #fff; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  /* ---------- home ---------- */
  .home { display:grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
  .tiles { display:grid; gap: 22px; }
  .tile { position: relative; display:block; text-decoration:none; padding: 24px; border-radius: 16px; background: var(--panel);
          border:1px solid var(--line); transition: border-color .15s, transform .15s; overflow: hidden; }
  .tile:hover { border-color: #3a4050; }
  .tile-head { display:flex; align-items:flex-start; gap: 16px; }
  .tile-icon { width:46px; height:46px; border-radius: 12px; display:grid; place-items:center; flex:none; }
  .tile-icon svg { width: 22px; height: 22px; }
  .tile-icon.assets { background: rgba(96,165,250,.12); color: var(--blue); }
  .tile-icon.programs { background: rgba(255,179,64,.12); color: var(--accent); }
  .tile h2 { margin: 0; font-size: 20px; letter-spacing: .04em; }
  .tile p { margin: 4px 0 0; color: var(--muted); }
  .tile .open { margin-left: auto; color: var(--muted); display:flex; align-items:center; gap:6px; font-weight:600; font-size: 13px; }
  .tile:hover .open { color: var(--text); }
  .tile-body { margin-top: 20px; }
  .strip { display:grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .strip .th { aspect-ratio: 16/9; border-radius: 8px; }
  .prog-chips { display:flex; flex-wrap: wrap; gap: 8px; }
  .prog-chip { padding: 8px 12px; border-radius: 10px; background: var(--panel2); border:1px solid var(--line); font-weight: 600; font-size: 13px; }
  .prog-chip span { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .empty-line { color: var(--dim); font-size: 13px; }

  .control { display:grid; gap: 18px; position: sticky; top: 84px; }
  .control .row { display:flex; align-items:center; gap: 10px; }
  .control .seg { width: 100%; }
  .control .seg button { flex: 1; height: 34px; }
  .vol-row { display:flex; align-items:center; gap: 12px; }
  .vol-row output { width: 30px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sep { height: 1px; background: var(--line); margin: 0 -20px; }
  .kv { display:flex; justify-content: space-between; gap: 10px; }
  .warn-box { padding: 10px 12px; border-radius: 10px; background: rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.25); color: #f5d27a; font-size: 13px; }
  .err-box { padding: 10px 12px; border-radius: 10px; background: rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.25); color: #fca5a5; font-size: 13px; }

  /* ---------- thumbs ---------- */
  .th { position: relative; background: #0a0b0e center/cover no-repeat; overflow: hidden; display:grid; place-items:center; color: var(--dim); border:1px solid var(--line); }
  .th svg { width: 26px; height: 26px; opacity: .7; }
  .th.audio { background: linear-gradient(135deg, #1d2438, #141824); color: var(--blue); }
  .badge { position:absolute; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.7); color: #fff; letter-spacing: .02em; }
  .badge.tl { top: 8px; left: 8px; text-transform: uppercase; }
  .badge.br { bottom: 8px; right: 8px; font-variant-numeric: tabular-nums; }

  /* ---------- assets ---------- */
  .toolbar { display:flex; align-items:center; gap: 10px; margin-bottom: 18px; }
  .toolbar .field.search { width: 280px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .card { background: var(--panel); border:1px solid var(--line); border-radius: var(--r); overflow: hidden; display:flex; flex-direction: column; }
  .card:hover { border-color: #353a47; }
  .card .th { aspect-ratio: 16/9; border: 0; border-bottom: 1px solid var(--line); }
  .card .hover { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap: 8px; background: rgba(8,9,12,.55); opacity: 0; transition: opacity .15s; }
  .card:hover .hover { opacity: 1; }
  .card .info { padding: 12px 12px 10px 14px; display:flex; align-items:flex-start; gap: 6px; }
  .card .info .txt { flex: 1; min-width: 0; }
  .card .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; border-radius: 6px; padding: 1px 4px; margin: -1px -4px; }
  .card .name:hover { background: var(--panel2); }
  .card .name-input { width: 100%; height: 28px; padding: 0 6px; margin: -3px -6px; font-weight: 600; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .file { color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .acts { display:flex; gap: 2px; }

  .drop { border: 1.5px dashed var(--line2); border-radius: 16px; padding: 46px; text-align: center; color: var(--muted); background: var(--panel); }
  .drop h3 { color: var(--text); margin: 10px 0 4px; font-size: 16px; }
  .drop svg { width: 34px; height: 34px; color: var(--blue); }
  .drop-overlay { position: fixed; inset: 0; z-index: 40; background: rgba(13,14,18,.82); display:grid; place-items:center; pointer-events: none; }
  .drop-overlay div { padding: 60px 90px; border: 2px dashed var(--accent); border-radius: 20px; font-size: 20px; font-weight: 700; color: var(--accent); background: rgba(255,179,64,.05); }

  .uploads { display:grid; gap: 8px; margin-bottom: 18px; }
  .up { display:grid; grid-template-columns: 1fr 140px 70px; align-items:center; gap: 14px; padding: 10px 14px; border-radius: 10px; background: var(--panel); border:1px solid var(--line); font-size: 13px; }
  .bar { height: 6px; border-radius: 99px; background: #262a33; overflow: hidden; }
  .bar i { display:block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .up.done .bar i { background: var(--ok); }
  .up.fail .bar i { background: var(--err); }

  /* ---------- programs ---------- */
  .split { display:grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; align-items: start; }
  .plist { padding: 10px; display:grid; gap: 4px; position: sticky; top: 84px; }
  .plist .head { display:flex; align-items:center; justify-content: space-between; padding: 8px 8px 10px; }
  .pitem { text-align: left; width: 100%; padding: 11px 12px; border-radius: 10px; border:1px solid transparent; background: transparent; display:flex; align-items:center; gap: 10px; }
  .pitem:hover { background: var(--panel2); }
  .pitem.on { background: var(--panel2); border-color: var(--line2); }
  .pitem .pi { width: 34px; height: 34px; border-radius: 9px; display:grid; place-items:center; flex: none; background: rgba(255,179,64,.1); color: var(--accent); }
  .pitem .pi.tv { background: rgba(52,211,153,.1); color: var(--ok); }
  .pitem .pi svg { width: 17px; height: 17px; }
  .pitem .t { font-weight: 600; }
  .pitem .s { color: var(--muted); font-size: 12px; }
  .editor { padding: 24px; display:grid; gap: 22px; }
  .editor .namefield { font-size: 20px; font-weight: 700; height: 46px; width: 100%; }
  .section-head { display:flex; align-items:center; gap: 10px; margin-bottom: 10px; }
  .section-head .label { flex: 1; }
  .rows { display:grid; gap: 6px; }
  .rowi { display:grid; grid-template-columns: 26px 96px minmax(0,1fr) auto auto; align-items:center; gap: 12px; padding: 8px 10px; border-radius: 10px; background: #111319; border:1px solid var(--line); }
  .rowi .n { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; font-size: 12px; }
  .rowi .th { width: 96px; aspect-ratio: 16/9; border-radius: 6px; }
  .rowi .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rowi .nm.missing { color: var(--err); }
  .rowi .d { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .rowi .ops { display:flex; gap: 2px; }
  .empty-rows { padding: 18px; border-radius: 10px; border:1px dashed var(--line2); color: var(--dim); text-align: center; }
  .tv-base { display:flex; gap: 14px; align-items:center; padding: 16px; border-radius: 12px; background: rgba(52,211,153,.06); border:1px solid rgba(52,211,153,.2); }
  .tv-base svg { width: 26px; height: 26px; color: var(--ok); flex: none; }
  .editor-foot { display:flex; align-items:center; gap: 10px; padding-top: 4px; border-top: 1px solid var(--line); padding-top: 18px; }

  /* ---------- settings ---------- */
  .settings { display:grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 22px; align-items: start; }
  .settings .col { display:grid; gap: 22px; }
  .tvhero { padding: 24px; display:grid; gap: 20px; }
  .tvhero .top { display:flex; align-items:center; gap: 16px; }
  .tvhero .scr { width: 64px; height: 44px; border-radius: 8px; border: 2px solid var(--line2); display:grid; place-items:center; color: var(--muted); position: relative; }
  .tvhero .scr::after { content:""; position:absolute; bottom:-8px; width: 22px; height: 4px; border-radius: 2px; background: var(--line2); }
  .tvhero .scr.ok { border-color: var(--ok); color: var(--ok); }
  .tvhero .scr.wait { border-color: var(--warn); color: var(--warn); animation: pulse 1.1s infinite; }
  .tvhero .scr svg { width: 22px; height: 22px; }
  .tvhero h2 { margin: 0; font-size: 18px; }
  .steps { display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .step { padding: 12px 14px; border-radius: 10px; background: #111319; border:1px solid var(--line); display:flex; gap: 10px; align-items:center; color: var(--muted); }
  .step i { width: 24px; height: 24px; border-radius: 50%; display:grid; place-items:center; font-style: normal; font-weight: 700; font-size: 12px; background: #262a33; flex: none; }
  .step.done { color: var(--text); }
  .step.done i { background: var(--ok); color: #062014; }
  .step.cur { color: var(--text); border-color: rgba(255,179,64,.45); background: rgba(255,179,64,.06); }
  .step.cur i { background: var(--accent); color: var(--accent-ink); }
  .pairing-box { display:flex; align-items:center; gap: 16px; padding: 16px 18px; border-radius: 12px; border:1px solid rgba(251,191,36,.35); background: rgba(251,191,36,.06); }
  .ring { width: 46px; height: 46px; flex: none; position: relative; }
  .ring svg { width: 46px; height: 46px; transform: rotate(-90deg); }
  .ring b { position:absolute; inset:0; display:grid; place-items:center; font-size: 13px; color: var(--warn); }
  .tvrow { display:grid; grid-template-columns: 1fr auto; gap: 12px; align-items:center; padding: 12px 14px; border-radius: 10px; background: #111319; border:1px solid var(--line); }
  .tvrow.active { border-color: rgba(255,179,64,.4); }
  .tvrow .nm { font-weight: 600; display:flex; gap: 8px; align-items:center; }
  .tvrow .ip { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #262a33; color: var(--muted); }
  .pill.ok { background: rgba(52,211,153,.14); color: var(--ok); }
  .pill.acc { background: rgba(255,179,64,.14); color: var(--accent); }
  .setrow { display:flex; align-items:center; gap: 14px; }
  .setrow .txt { flex: 1; }
  .setrow .t { font-weight: 600; }
  code.box { display:block; padding: 10px 12px; border-radius: 8px; background: #0a0b0e; border:1px solid var(--line); font-size: 12px; color: #c9cdd6; word-break: break-all; }

  /* ---------- modal / toast ---------- */
  .modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(5,6,8,.72); display:grid; place-items:center; padding: 30px; }
  .modal { width: min(520px, 100%); max-height: calc(100vh - 60px); display:flex; flex-direction: column; background: var(--panel); border:1px solid var(--line2); border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .modal.wide { width: min(980px, 100%); }
  .modal-head { display:flex; align-items:center; gap: 10px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { margin: 0; font-size: 16px; flex: 1; }
  .modal-body { padding: 20px; overflow: auto; }
  .modal-foot { display:flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
  .pick-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .pick { text-align: left; padding: 0; border-radius: 10px; overflow: hidden; border: 2px solid var(--line); background: #111319; position: relative; }
  .pick .th { aspect-ratio: 16/9; border: 0; }
  .pick .pn { padding: 8px 10px; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick.on { border-color: var(--accent); }
  .pick .ck { position:absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.6); border: 2px solid #fff6; display:grid; place-items:center; font-size: 12px; font-weight: 800; }
  .pick.on .ck { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .preview-media { width: 100%; max-height: 62vh; border-radius: 10px; background: #000; display:block; }
  .pin-input { font-size: 26px; letter-spacing: .5em; text-align: center; height: 56px; width: 100%; }
  #toasts { position: fixed; right: 24px; bottom: 24px; z-index: 60; display:grid; gap: 8px; }
  .toast { padding: 12px 16px; border-radius: 10px; background: #232733; border:1px solid var(--line2); box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: 380px; animation: tin .2s ease-out; }
  .toast.err { background: #3a1d22; border-color: rgba(248,113,113,.4); color: #fecaca; }
  .toast.ok { border-left: 3px solid var(--ok); }
  @keyframes tin { from { transform: translateY(8px); opacity: 0; } }

  @media (max-width: 1000px) {
    .home, .settings, .split { grid-template-columns: 1fr; }
    .control, .plist { position: static; }
    main { padding: 18px; }
    .topbar { padding: 0 16px; }
    .hide-narrow { display: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/"><span class="logo">TV</span><span>BarTV Controller</span></a>
  <div class="crumbs" id="crumbs"></div>
  <div class="spacer"></div>
  <span class="chip hide-narrow" id="chipAd"></span>
  <span class="chip hide-narrow" id="chipScreens"></span>
  <button class="chip" id="chipTv" onclick="go('#/settings')"></button>
  <a class="gear" id="gear" href="#/settings" title="Settings">

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(0) + ' KB' : b < 1073741824 ? (b/1048576).toFixed(1) + ' MB' : (b/1073741824).toFixed(2) + ' GB';
const fmtDur = s => { if (s == null) return ''; s = Math.round(s); const m = Math.floor(s/60), r = s % 60; return m >= 60 ? `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}:${String(r).padStart(2,'0')}` : `${m}:${String(r).padStart(2,'0')}`; };
const fmtTime = s => s ? new Date(s).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '—';
const go = h => { location.hash = h; };

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? 4500 : 2600);
}

/* ================= API + PIN ================= */
let pin = localStorage.getItem('bartv_pin') || '';

async function api(method, url, body, {silent} = {}) {
  const opt = {method, headers: {'X-Pin': pin}};
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) {
    if (silent) throw new Error('PIN required');
    await askPin(pin ? 'Wrong PIN - try again' : '');
    return api(method, url, body);
  }
  if (!r.ok) {
    const d = data.detail;
    throw new Error(typeof d === 'string' ? d : Array.isArray(d) ? d.map(x => x.msg).join(', ') : r.statusText);
  }
  return data;
}
async function act(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg, 'ok'); return r ?? true; }
  catch (e) { if (e.message !== 'cancelled') toast(e.message, 'err'); return null; }
}

function askPin(err) {
  return new Promise((resolve, reject) => {
    const m = modal(`
      <div class="modal-head"><h3>Enter PIN</h3></div>
      <div class="modal-body" style="display:grid;gap:12px">
        <div class="muted">The 6-digit PIN is printed in the server console and stored in <code>config.json</code>.</div>
        <input class="field pin-input" id="pinIn" inputmode="numeric" maxlength="6" autocomplete="off">
        ${err ? `<div class="err-box">${esc(err)}</div>` : ''}
      </div>
      <div class="modal-foot"><button class="btn" data-x>Cancel</button><button class="btn primary" id="pinOk">Unlock</button></div>`,
      () => reject(new Error('cancelled')));
    const inp = m.el.querySelector('#pinIn');
    const ok = () => { const v = inp.value.trim(); if (!v) return; pin = v; localStorage.setItem('bartv_pin', v); m.close(true); resolve(); };
    m.el.querySelector('#pinOk').onclick = ok;
    inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
    setTimeout(() => inp.focus(), 30);
  });
}

/* ================= modal helper ================= */
function modal(html, onCancel, cls = '') {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  $('#modals').appendChild(back);
  const m = {
    el: back,
    close(silent) { back.remove(); document.removeEventListener('keydown', onKey); if (!silent && onCancel) onCancel(); },
  };
  const onKey = e => { if (e.key === 'Escape') m.close(); };
  document.addEventListener('keydown', onKey);
  back.addEventListener('mousedown', e => { if (e.target === back) m.close(); });
  back.querySelectorAll('[data-x]').forEach(b => b.onclick = () => m.close());
  return m;
}
function confirmBox(title, text, okLabel = 'Delete', danger = true) {
  return new Promise(resolve => {
    const m = modal(`
      <div class="modal-head"><h3>${esc(title)}</h3></div>
      <div class="modal-body muted">${text}</div>
      <div class="modal-foot"><button class="btn" data-x>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="cOk">${esc(okLabel)}</button></div>`,
      () => resolve(false));
    m.el.querySelector('#cOk').onclick = () => { m.close(true); resolve(true); };
  });
}

/* ================= top bar ================= */
function tvState(s) {
  if (!s) return {dot: 'err', text: 'Server offline'};
  if (s.pairing) return {dot: 'warn pulse', text: 'Pairing… accept on TV'};
  if (s.mock_tv) return {dot: s.paired ? 'ok' : 'warn', text: s.paired ? 'Demo TV connected' : 'Demo TV · not paired'};
  const tv = (s.tvs || []).find(t => t.active);
  const name = tv ? tv.name : 'TV';
  return s.paired ? {dot: 'ok', text: `${name} connected`} : {dot: 'err', text: `${name} not paired`};
}
function renderTopbar() {
  const s = S.status, st = tvState(s);

  if (s) {
    $('#chipScreens').innerHTML = `<span class="dot ${s.displays_connected ? 'ok' : ''}"></span>${s.displays_connected} screen${s.displays_connected === 1 ? '' : 's'}`;

      `Next ad <b>${s.scheduler_enabled ? fmtTime(s.next_ad) : 'paused'}</b>`;
  }

  $('#gear').classList.toggle('active', S.route === 'settings');
}

/* ================= thumbnails ================= */
function makeThumb(src, kind) {
  return new Promise(resolve => {
    const W = 384, H = 216;
    const draw = (el, w, h) => {
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      const sc = Math.max(W / w, H / h), dw = w * sc, dh = h * sc;
      g.drawImage(el, (W - dw) / 2, (H - dh) / 2, dw, dh);
      try { return c.toDataURL('image/jpeg', 0.74); } catch { return null; }
    };
    const t = setTimeout(() => resolve({}), 12000);
    if (kind === 'image') {
      const im = new Image();
      im.onload = () => { clearTimeout(t); resolve({thumb: draw(im, im.naturalWidth, im.naturalHeight)}); };
      im.onerror = () => { clearTimeout(t); resolve({}); };
      im.src = src;
      return;
    }
    const v = document.createElement(kind === 'audio' ? 'audio' : 'video');
    v.muted = true; v.preload = 'metadata'; v.playsInline = true;
    v.onloadedmetadata = () => {
      if (kind === 'audio') { clearTimeout(t); resolve({duration: v.duration}); return; }
      v.currentTime = Math.min(Math.max(v.duration * 0.2, 0.5), 8);
    };
    v.onseeked = () => { clearTimeout(t); resolve({thumb: draw(v, v.videoWidth, v.videoHeight), duration: v.duration}); };
    v.onerror = () => { clearTimeout(t); resolve({}); };
    v.src = src;
  });
}
let backfilling = false;
async function backfillThumbs() {
  if (backfilling || !pin) return;
  backfilling = true;
  try {
    for (const a of S.assets) {
      const needThumb = !a.thumb && (a.kind === 'video' || a.kind === 'image');
      const needDur = a.duration == null && (a.kind === 'video' || a.kind === 'audio');
      if (!needThumb && !needDur) continue;
      const r = await makeThumb(a.url, a.kind);
      if (!r.thumb && r.duration == null) continue;
      try {
        const upd = await api('PATCH', '/api/assets/' + encodeURIComponent(a.file), {thumb: r.thumb || undefined, duration: isFinite(r.duration) ? r.duration : undefined}, {silent: true});
        Object.assign(a, upd);
        refreshAssetViews();
      } catch { break; }
    }
  } finally { backfilling = false; }
}
function refreshAssetViews() {
  if (S.route === 'assets') renderAssetGrid();
  else if (S.route === 'home') renderHomeTiles();
  else if (S.route === 'programs') renderEditor();
}
function thumbHtml(a, cls = '') {
  if (!a) return `<div class="th ${cls}">${I.x}</div>`;
  const icon = a.kind === 'audio' ? I.music : a.kind === 'image' ? I.img : I.film;
  const bg = a.thumb ? ` style="background-image:url('${a.thumb}')"` : '';
  return `<div class="th ${a.kind === 'audio' ? 'audio' : ''} ${cls}"${bg}>${a.thumb ? '' : icon}</div>`;
}

/* ================= router ================= */
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [name, arg] = h.split('/');
  S.route = ['assets', 'programs', 'settings'].includes(name) ? name : 'home';
  if (S.route === 'programs' && arg) S.selProgram = decodeURIComponent(arg);
  renderTopbar();
  ({home: renderHome, assets: renderAssets, programs: renderPrograms, settings: renderSettings})[S.route]();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => {
  if (S.route === 'programs' && isDirty() && !confirm('Discard unsaved program changes?')) {
    history.replaceState(null, '', '#/programs/' + encodeURIComponent(S.selProgram)); return;
  }
  route();
});

function renderHome() {

      <div class="tiles" id="tiles"></div>

    </div>`;
  renderHomeTiles();
  renderControlPanel();
}
function renderHomeTiles() {
  const el = $('#tiles'); if (!el) return;
  const recent = [...S.assets].slice(0, 6);
  const counts = {video: 0, image: 0, audio: 0};

  el.innerHTML = `
    <a class="tile" href="#/assets">
      <div class="tile-head">
        <div class="tile-icon assets">${I.film}</div>
        <div><h2>ASSETS</h2><p>${S.assets.length} item${S.assets.length === 1 ? '' : 's'} · ${counts.video} video · ${counts.image} image · ${counts.audio} audio</p></div>
        <span class="open">Manage ${I.right}</span>
      </div>
      <div class="tile-body">
        ${recent.length ? `<div class="strip">${recent.map(a => thumbHtml(a)).join('')}${Array(Math.max(0, 6 - recent.length)).fill('<div class="th" style="border-style:dashed;opacity:.4"></div>').join('')}</div>`
          : `<div class="empty-line">No media yet - open Assets to upload videos, images and audio.</div>`}
      </div>
    </a>
    <a class="tile" href="#/programs">
      <div class="tile-head">
        <div class="tile-icon programs">${I.layers}</div>
        <div><h2>PROGRAMS</h2><p>${S.programs.length} program${S.programs.length === 1 ? '' : 's'} · what to show and which commercials run on top</p></div>
        <span class="open">Manage ${I.right}</span>
      </div>
      <div class="tile-body">
        ${S.programs.length ? `<div class="prog-chips">${S.programs.map(p => `<span class="prog-chip">${esc(p.name)}<span>${progSummary(p)}</span></span>`).join('')}</div>`
          : `<div class="empty-line">No programs yet.</div>`}
      </div>
    </a>`;
}
function progSummary(p) {
  const base = p.base === 'tv' ? 'TV' : `${p.content.length} clip${p.content.length === 1 ? '' : 's'}`;
  return `${base} + ${p.commercials.length} ad${p.commercials.length === 1 ? '' : 's'}`;
}
let volTimer = null;
function renderControlPanel() {
  const el = $('#control'); if (!el) return;
  const s = S.status;
  if (!s) { el.innerHTML = `<div class="err-box">Server unreachable - is start.bat running?</div>`; return; }
  if (el.dataset.ready) { updateControlPanel(); return; }
  el.dataset.ready = '1';
  el.innerHTML = `
    <div class="label">Live control</div>
    <button class="btn primary lg" id="adBtn">${I.ad} Play ad break now</button>
    <div id="ctlNotes" style="display:grid;gap:8px"></div>
    <div class="sep"></div>
    <div style="display:grid;gap:8px">
      <div class="label">TV input</div>
      <div class="seg" id="inputSeg"><button data-in="normal">Live TV</button><button data-in="signage">Signage</button></div>
    </div>
    <div style="display:grid;gap:8px">
      <div class="label">Volume</div>
      <div class="vol-row"><input type="range" id="vol" min="0" max="100" value="20"><output id="volOut">20</output>
        <button class="btn sm" id="muteBtn">Mute</button></div>
    </div>
    <button class="btn" id="stopBtn">Stop media on screen</button>
    <div class="sep"></div>
    <div class="setrow">
      <div class="txt"><div class="t">Auto ad breaks</div><div class="muted small" id="schedTxt"></div></div>
      <label class="switch"><input type="checkbox" id="schedSw"><span></span></label>
    </div>`;
  $('#adBtn').onclick = () => act(() => api('POST', '/api/trigger-ad', {}), 'Ad break started').then(loadStatus);
  el.querySelectorAll('#inputSeg button').forEach(b => b.onclick = () => {
    const input = b.dataset.in === 'normal' ? S.status.normal_input : S.status.signage_input;
    act(() => api('POST', '/api/input', {input}), 'Switched to ' + input);
  });
  const vol = $('#vol');
  vol.oninput = () => { $('#volOut').textContent = vol.value; clearTimeout(volTimer); volTimer = setTimeout(() => act(() => api('POST', '/api/volume', {level: +vol.value})), 250); };
  $('#muteBtn').onclick = () => {
    const m = $('#muteBtn').dataset.m !== '1';
    act(() => api('POST', '/api/mute', {mute: m})).then(r => { if (r) { $('#muteBtn').dataset.m = m ? '1' : ''; $('#muteBtn').textContent = m ? 'Unmute' : 'Mute'; } });
  };
  $('#stopBtn').onclick = () => act(() => api('POST', '/api/stop', {}), 'Stopped');
  $('#schedSw').onchange = e => act(() => api('POST', '/api/scheduler', {enabled: e.target.checked}), e.target.checked ? 'Auto ads on' : 'Auto ads paused').then(loadStatus);
  updateControlPanel();
}
function updateControlPanel() {
  const s = S.status; if (!s || !$('#adBtn')) return;
  $('#adBtn').disabled = s.ad_running;
  $('#adBtn').innerHTML = s.ad_running ? `${I.ad} Ad break playing…` : `${I.ad} Play ad break now`;
  const notes = [];
  if (!s.paired) notes.push(`<div class="warn-box">TV not paired - <a href="#/settings">connect it in Settings</a>.</div>`);
  if (!s.promo_exists) notes.push(`<div class="warn-box">Promo video missing (<code>static/media/promo.mp4</code>).</div>`);
  if (s.last_error) notes.push(`<div class="err-box">${esc(s.last_error)}</div>`);
  $('#ctlNotes').innerHTML = notes.join('');
  $('#schedSw').checked = s.scheduler_enabled;
  $('#schedTxt').textContent = s.scheduler_enabled ? `Every ${s.ad_interval_minutes} min · next ${fmtTime(s.next_ad)} · last ${fmtTime(s.last_ad)}` : 'Paused';
  const seg = document.querySelectorAll('#inputSeg button');
  seg[0].textContent = `Live TV · ${s.normal_input}`; seg[1].textContent = `Signage · ${s.signage_input}`;
}

$('#filePick').onchange = e => { uploadFiles([...e.target.files]); e.target.value = ''; };
let dragDepth = 0;
window.addEventListener('dragenter', e => { if (!e.dataTransfer.types.includes('Files')) return; e.preventDefault(); dragDepth++; $('#dropOverlay').hidden = false; });
window.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropOverlay').hidden = true; });
window.addEventListener('drop', e => {
  if (!e.dataTransfer.files.length) return;
  e.preventDefault(); dragDepth = 0; $('#dropOverlay').hidden = true;
  if (S.route !== 'assets') go('#/assets');
  setTimeout(() => uploadFiles([...e.dataTransfer.files]), 0);
});

function xhrPut(url, file, onProg) {
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('X-Pin', pin);
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.upload.onprogress = e => e.lengthComputable && onProg(e.loaded / e.total);
    x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch {} resolve({status: x.status, data: d}); };
    x.onerror = () => resolve({status: 0, data: {detail: 'Network error'}});
    x.send(file);
  });
}
async function uploadFiles(files) {
  if (!files.length) return;
  if (!pin) { try { await askPin(''); } catch { return; } }
  for (const file of files) {
    const row = document.createElement('div');
    row.className = 'up';
    row.innerHTML = `<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>${esc(file.name)}</b> <span class="muted">${fmtSize(file.size)}</span></div><div class="bar"><i></i></div><div class="muted st">0%</div>`;
    const box = $('#uploads'); if (box) box.appendChild(row);
    const setP = p => { row.querySelector('i').style.width = (p * 100).toFixed(0) + '%'; row.querySelector('.st').textContent = (p * 100).toFixed(0) + '%'; };
    let url = '/api/assets/' + encodeURIComponent(file.name);
    let r = await xhrPut(url, file, setP);
    if (r.status === 401) { try { await askPin('Wrong PIN - try again'); } catch { row.remove(); continue; } r = await xhrPut(url, file, setP); }
    if (r.status === 409 && await confirmBox('Replace existing file?', `<b>${esc(file.name)}</b> already exists in Assets. Replace it with the new upload?`, 'Replace', false)) {
      r = await xhrPut(url + '?replace=true', file, setP);
    }
    if (r.status === 200) {
      setP(1); row.classList.add('done'); row.querySelector('.st').textContent = 'Done';
      const asset = r.data;
      const blob = URL.createObjectURL(file);
      const t = await makeThumb(blob, asset.kind);
      setTimeout(() => URL.revokeObjectURL(blob), 5000);
      if (t.thumb || isFinite(t.duration)) {
        await api('PATCH', '/api/assets/' + encodeURIComponent(asset.file), {thumb: t.thumb || undefined, duration: isFinite(t.duration) ? t.duration : undefined}, {silent: true}).catch(() => {});
      }
      await loadAssets();
      if (S.route === 'assets') renderAssetGrid(); else refreshAssetViews();
      setTimeout(() => row.remove(), 2500);
    } else {
      row.classList.add('fail');
      row.querySelector('.st').textContent = 'Failed';
      toast(`${file.name}: ${r.data.detail || 'upload failed'}`, 'err');
      setTimeout(() => row.remove(), 6000);
    }
  }
}

    ${s.pairing ? `<div class="pairing-box">
        <div class="ring"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" stroke="#3a3420" stroke-width="4" fill="none"/>
          <circle cx="23" cy="23" r="20" stroke="var(--warn)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - remain / PAIR_SECONDS)}"/></svg><b>${remain}</b></div>
        <div><b>Look at the TV now.</b><div class="muted small">It shows “Allow this device to access the TV?”. Press <b>Accept</b> / <b>OK</b> on the remote within ${PAIR_SECONDS} seconds.</div></div>
      </div>` : ''}
    ${!s.pairing && s.pair_error && s.pair_error !== 'cancelled' ? `<div class="err-box">Last pairing attempt failed: ${esc(s.pair_error)}</div>` : ''}
    ${s.paired && s.tv_inputs?.length ? `<div class="muted small">TV reports inputs: <b style="color:var(--text)">${s.tv_inputs.map(esc).join(', ')}</b>${[s.normal_input, s.signage_input].some(i => !s.tv_inputs.includes(i)) ? ` <span style="color:var(--warn)">· configured inputs ${esc(s.normal_input)}/${esc(s.signage_input)} not all found - check config.json</span>` : ''}</div>` : ''}`;
  const pb = $('#pairBtn');
  if (pb) pb.onclick = async () => {
    if (await act(() => api('POST', '/api/pair', {}))) { S.pairStarted = Date.now(); await loadStatus(); }
  };
  const pc = $('#pairCancel');
  if (pc) pc.onclick = async () => { await act(() => api('POST', '/api/pair/cancel', {}), 'Pairing cancelled'); await loadStatus(); };
  const ub = $('#unpairBtn');
  if (ub) ub.onclick = async () => {
    if (!await confirmBox('Unpair TV?', 'The saved pairing key is removed. You will need to accept the prompt on the TV again to reconnect.', 'Unpair')) return;
    await act(() => api('POST', '/api/unpair', {}), 'Unpaired'); await loadStatus();
  };
}
function renderTvList() {
  const s = S.status, el = $('#tvList');
  if (el.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
  const tvs = s.tvs || [];
  const disc = S.discovered;
  el.innerHTML = `
    <div class="section-head"><span class="label">TVs</span>
      <button class="btn sm" id="scanBtn" ${S.scanning || s.pairing ? 'disabled' : ''}>${I.search} ${S.scanning ? 'Searching…' : 'Find TVs on network'}</button></div>
    <div class="rows" style="gap:8px">
      ${s.mock_tv ? `<div class="tvrow active"><div><div class="nm">Demo TV <span class="pill acc">Active</span> ${s.paired ? '<span class="pill ok">Paired</span>' : ''}</div><div class="ip">Simulated - turn off Demo mode to use a real TV</div></div><div></div></div>` : ''}
      ${tvs.map(t => `
        <div class="tvrow ${t.active ? 'active' : ''}">
          <div><div class="nm">${esc(t.name)} ${t.active ? '<span class="pill acc">Active</span>' : ''} ${t.paired ? '<span class="pill ok">Paired</span>' : '<span class="pill">Not paired</span>'}</div><div class="ip">${esc(t.ip)}</div></div>
          <div style="display:flex;gap:6px">
            ${t.active ? '' : `<button class="btn sm" data-use="${esc(t.ip)}" ${s.pairing ? 'disabled' : ''}>Use this TV</button>`}
            <button class="icon-btn" data-rename="${esc(t.ip)}" data-name="${esc(t.name)}" title="Rename">${I.edit}</button>
            <button class="icon-btn danger" data-forget="${esc(t.ip)}" title="Forget">${I.trash}</button>
          </div>
        </div>`).join('')}
      ${!tvs.length && !s.mock_tv ? `<div class="empty-rows">No TVs yet.</div>` : ''}
    </div>
    ${disc ? `<div style="margin-top:16px">
      <div class="label" style="margin-bottom:8px">Found on network</div>
      ${disc.length ? `<div class="rows" style="gap:8px">${disc.map(t => `
        <div class="tvrow"><div><div class="nm">${esc(t.name)}</div><div class="ip">${esc(t.ip)}</div></div>
          <button class="btn sm primary" data-use="${esc(t.ip)}" data-name="${esc(t.name)}">Use this TV</button></div>`).join('')}</div>`
        : `<div class="warn-box">No LG TVs answered. Make sure the TV is on and on the same Wi-Fi as this computer. Guest networks often block devices from seeing each other - add the TV by IP below (TV: Settings → General → Network → Wi-Fi → Advanced).</div>`}
    </div>` : ''}
    <div style="margin-top:16px">
      <div class="label" style="margin-bottom:8px">Add TV by IP</div>
      <div style="display:flex;gap:8px">
        <input class="field" id="addIp" placeholder="192.168.1.150" style="flex:1">
        <input class="field" id="addName" placeholder="Name (e.g. Bar TV)" style="flex:1">
        <button class="btn" id="addBtn" ${s.pairing ? 'disabled' : ''}>Add &amp; select</button>
      </div>
    </div>`;
  $('#scanBtn').onclick = async () => {
    S.scanning = true; renderTvList();
    try { S.discovered = (await (await fetch('/api/tv/discover')).json()).tvs; } catch { S.discovered = []; }
    S.scanning = false; renderTvList();
  };
  el.querySelectorAll('[data-use]').forEach(b => b.onclick = () => selectTv(b.dataset.use, b.dataset.name));
  el.querySelectorAll('[data-forget]').forEach(b => b.onclick = async () => {
    if (!await confirmBox('Forget TV?', `Remove <b>${esc(b.dataset.forget)}</b> and its pairing key from this controller.`, 'Forget')) return;
    if (await act(() => api('DELETE', '/api/tvs/' + encodeURIComponent(b.dataset.forget)), 'TV removed')) await loadStatus();
  });
  el.querySelectorAll('[data-rename]').forEach(b => b.onclick = async () => {
    const n = prompt('TV name', b.dataset.name); if (!n || !n.trim()) return;
    const ip = b.dataset.rename;
    if (ip === S.status.tv_ip) { if (await act(() => api('POST', '/api/tv', {name: n.trim()}), 'Renamed')) loadStatus(); }
    else toast('Select the TV first, then rename it', 'err');
  });
  $('#addBtn').onclick = () => {
    const ip = $('#addIp').value.trim();
    if (!/^[\w.\-:]+$/.test(ip)) { toast('Enter a valid IP address', 'err'); return; }
    selectTv(ip, $('#addName').value.trim());
  };
}
async function selectTv(ip, name) {
  const body = {tv_ip: ip, mock_tv: false};
  if (name) body.name = name;
  const r = await act(() => api('POST', '/api/tv', body), 'TV selected');
  if (r) { S.status = r; renderTopbar(); renderSettings(); }
}
function renderSide() {
  const s = S.status, el = $('#sideCol');
  if (el.contains(document.activeElement) && document.activeElement.tagName === 'INPUT' && document.activeElement.type !== 'checkbox') return;
  const kiosk = `${location.origin}/display`;
  el.innerHTML = `
    <div class="panel panel-pad" style="display:grid;gap:16px">
      <div class="label">Mode</div>
      <div class="setrow"><div class="txt"><div class="t">Demo mode</div><div class="muted small">Simulated TV - test everything without the real TV. Switching modes drops the current pairing.</div></div>
        <label class="switch"><input type="checkbox" id="mockSw" ${s.mock_tv ? 'checked' : ''} ${s.pairing ? 'disabled' : ''}><span></span></label></div>
    </div>
    <div class="panel panel-pad" style="display:grid;gap:16px">
      <div class="label">Ad schedule</div>
      <div class="setrow"><div class="txt"><div class="t">Auto ad breaks</div><div class="muted small">Every ${s.ad_interval_minutes} min · next ${s.scheduler_enabled ? fmtTime(s.next_ad) : 'paused'}</div></div>
        <label class="switch"><input type="checkbox" id="schedSw2" ${s.scheduler_enabled ? 'checked' : ''}><span></span></label></div>
      <div class="kv small"><span class="muted">Inputs</span><span>Live ${esc(s.normal_input)} · Signage ${esc(s.signage_input)}</span></div>
    </div>
    <div class="panel panel-pad" style="display:grid;gap:12px">
      <div class="label">Signage screen (HDMI 2)</div>
      <div class="muted small">Open this page fullscreen on the computer plugged into the TV's signage input. ${s.displays_connected} screen${s.displays_connected === 1 ? '' : 's'} connected.</div>
      <code class="box">${esc(kiosk)}</code>
      <div style="display:flex;gap:8px"><a class="btn sm" href="/display" target="_blank">Open screen</a><button class="btn sm" id="copyKiosk">Copy kiosk command</button></div>
    </div>
    <div class="panel panel-pad" style="display:grid;gap:12px">
      <div class="label">This device</div>
      <div class="setrow"><div class="txt"><div class="t">Saved PIN</div><div class="muted small">${pin ? 'This browser remembers the PIN' : 'No PIN saved'}</div></div>
        <button class="btn sm" id="forgetPin" ${pin ? '' : 'disabled'}>Forget PIN</button></div>
    </div>`;
  $('#mockSw').onchange = async e => {
    const r = await act(() => api('POST', '/api/tv', {mock_tv: e.target.checked}), e.target.checked ? 'Demo mode on' : 'Demo mode off');
    if (r) S.status = r; renderTopbar(); renderSettings();
  };
  $('#schedSw2').onchange = e => act(() => api('POST', '/api/scheduler', {enabled: e.target.checked}), e.target.checked ? 'Auto ads on' : 'Auto ads paused').then(loadStatus);
  $('#copyKiosk').onclick = () => {
    const cmd = `start "" chrome --kiosk --autoplay-policy=no-user-gesture-required ${kiosk}`;
    navigator.clipboard?.writeText(cmd).then(() => toast('Copied', 'ok'), () => prompt('Copy:', cmd));
  };
  $('#forgetPin').onclick = () => { pin = ''; localStorage.removeItem('bartv_pin'); toast('PIN forgotten on this browser', 'ok'); renderSide(); };
}

/* ================= boot ================= */
(async () => {
  await Promise.all([loadStatus(), loadAssets(), loadPrograms()]);
  route();
  let tick = 0;
  setInterval(() => {
    tick++;
    if (S.status?.pairing || tick % 3 === 0) loadStatus();
    else if (S.route === 'settings' && S.pairStarted) renderTvHero();
  }, 1000);
})();
</script>
</body>
</html>
